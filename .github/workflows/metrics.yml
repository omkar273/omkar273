name: Regenerate profile stat cards

# Self-hosted replacement for github-readme-stats / streak-stats: those are
# shared free instances that periodically go down or hit rate limits, and
# when they do, every README pointing at them shows a broken image. This
# workflow generates the same cards from the GitHub API and commits the
# SVGs straight into this repo, so the README never depends on a third
# party's uptime — see scripts/generate_cards.py.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/generate_cards.py"
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        env:
          # STATS_TOKEN = a fine-grained personal access token with
          # public_repo + read:user scopes, added as a repo secret.
          # The default GITHUB_TOKEN can't read GraphQL contribution
          # data or repos.list for arbitrary users — see SETUP.md.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_USERNAME: omkar273
        run: python3 scripts/generate_cards.py

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh profile stat cards [skip ci]"
            git push
          fi
